version: "4.1"
name: OLED
type: ARM
deviceName: null
packDir: null
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: USER
      files:
        - path: main.c
        - path: stm32f4xx_it.c
        - path: system_stm32f4xx.c
      folders: []
    - name: HARDWARE
      files:
        - path: ../HARDWARE/OLED/oled.c
        - path: ../HARDWARE/LED/led.c
      folders: []
    - name: SYSTEM
      files:
        - path: ../SYSTEM/delay/delay.c
        - path: ../SYSTEM/sys/sys.c
        - path: ../SYSTEM/usart/usart.c
      folders: []
    - name: CORE
      files:
        - path: ../CORE/startup_stm32f40_41xxx.s
      folders: []
    - name: FWLIB
      files:
        - path: ../FWLIB/src/misc.c
        - path: ../FWLIB/src/stm32f4xx_gpio.c
        - path: ../FWLIB/src/stm32f4xx_rcc.c
        - path: ../FWLIB/src/stm32f4xx_usart.c
        - path: ../FWLIB/src/stm32f4xx_syscfg.c
      folders: []
    - name: README
      files:
        - path: ../readme.txt
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: e3eabc49897e063e06187caec4ea3e3b
targets:
  OLED:
    cppPreprocessAttrs:
      defineList:
        - STM32F40_41xxx
        - USE_STDPERIPH_DRIVER
      incList:
        - ../CORE
        - ../SYSTEM/delay
        - ../SYSTEM/sys
        - ../SYSTEM/usart
        - .
        - ../HARDWARE/LED
        - ../HARDWARE/OLED
        - ../FWLIB/inc
        - .cmsis/include
        - RTE/_OLED
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: unspecified
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: true
              mem:
                size: "0x20000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x10000"
                startAddr: "0x10000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x100000"
                startAddr: "0x8000000"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
